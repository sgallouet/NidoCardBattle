name: AI simulation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/forest-terrain-layering
    paths:
      - 'src/data/types.ts'
      - 'src/data/units.ts'
      - 'src/data/cards.ts'
      - 'src/game/actions.ts'
      - 'src/game/actions.test.ts'
      - 'src/game/engine.ts'
      - 'src/game/engine.test.ts'
      - 'src/game/ai.ts'
      - 'src/game/ai.test.ts'
      - 'src/game/AiGameScene.ts'
      - 'src/game/simulation.ts'
      - 'src/game/simulation.test.ts'
      - 'src/game/simulation.report.test.ts'
      - 'docs/AI.md'
      - 'package.json'
      - '.github/workflows/ai-simulation.yml'

jobs:
  verify-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run simulate
