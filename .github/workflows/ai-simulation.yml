name: AI simulation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/forest-terrain-layering
    paths:
      - 'src/game/ai.ts'
      - 'src/game/ai.test.ts'
      - 'src/game/simulation.ts'
      - 'src/game/simulation.test.ts'
      - 'src/game/simulation.report.test.ts'
      - 'docs/AI.md'
      - 'package.json'
      - '.github/workflows/ai-simulation.yml'

jobs:
  verify-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run simulate
