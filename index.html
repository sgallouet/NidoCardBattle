<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141119" />
    <title>NidoCardBattle Prototype</title>
    <link rel="preload" as="image" href="./assets/game/ui/tutorial/how-to-play-mobile.webp" type="image/webp" media="(orientation: portrait)" fetchpriority="high" />
    <link rel="preload" as="image" href="./assets/game/ui/tutorial/how-to-play-wide.webp" type="image/webp" media="(orientation: landscape)" fetchpriority="high" />
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02091a; }
      .loading-screen { position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #02091a; }
      .loading-tutorial { position: absolute; inset: 0 0 44px; display: block; }
      .loading-tutorial-image { display: block; width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="loading-screen" class="loading-screen" style="--loading-progress: 0%" aria-label="Loading NidoCardBattle">
      <picture class="loading-tutorial">
        <source media="(orientation: portrait)" srcset="./assets/game/ui/tutorial/how-to-play-mobile.webp" />
        <img
          class="loading-tutorial-image"
          src="./assets/game/ui/tutorial/how-to-play-wide.webp"
          alt="How to play NidoCardBattle: play cards with mana, move and attack, capture sites, and defeat the enemy commander."
          width="1672"
          height="941"
          fetchpriority="high"
          decoding="sync"
        />
      </picture>
      <div class="loading-progress-panel">
        <div class="loading-bar-frame" aria-hidden="true">
          <div class="loading-bar-fill"></div>
          <div class="loading-bar-spark"></div>
        </div>
        <div class="loading-progress-copy" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span data-loading-status>Preparing the battlefield</span>
          <strong data-loading-percent>0%</strong>
        </div>
      </div>
    </div>
    <main id="app">
      <div id="game-container" aria-label="NidoCardBattle draggable hex battlefield"></div>
      <div id="status" class="sr-only" role="status" aria-live="polite">Player 1 begins.</div>

      <div id="victory-log-actions" class="victory-log-actions glass-panel" hidden>
        <button id="battle-log-download-button" class="battle-log-download" type="button">
          Download Battle Log
        </button>
        <span>Compact JSON for AI review</span>
      </div>

      <div class="mana-count" aria-label="Current mana">
        <span class="mana-gem"></span>
        <strong id="mana-count">3/10</strong>
      </div>

      <div class="zoom-controls" aria-label="Map zoom controls">
        <button id="zoom-out" type="button" aria-label="Zoom map out" title="Zoom out">−</button>
        <button id="zoom-reset" type="button" aria-label="Reset map zoom" title="Reset zoom">◎</button>
        <button id="zoom-in" type="button" aria-label="Zoom map in" title="Zoom in">+</button>
      </div>

      <aside id="unit-inspector" class="unit-inspector glass-panel" hidden>
        <button id="cancel-button" class="close-selection" type="button" aria-label="Clear unit selection">×</button>
        <div id="selected-unit" class="selected-unit muted">Select a unit on the battlefield.</div>
        <div class="action-row">
          <button id="ability-button" class="secondary" type="button" hidden></button>
          <button id="invoke-button" class="secondary" type="button" hidden>Invoke Beast</button>
        </div>
      </aside>

      <section class="hand-dock">
        <div class="hand-and-turn">
          <div id="hand" class="hand"></div>
          <div class="turn-control">
            <button id="end-turn-button" class="end-turn" type="button">End Turn</button>
            <div id="turn-indicator" class="turn-indicator">Player 1 turn</div>
            <button id="tile-border-button" class="secondary" type="button" aria-pressed="true">Borders: On</button>
            <button id="map-render-button" class="secondary" type="button">Map: Tiled</button>
            <button id="new-game-button" class="secondary" type="button">New Game</button>
          </div>
        </div>
      </section>

      <div id="debug-status" class="debug-status" data-tone="idle">
        Debug: ready — click End Turn to trace the turn and AI.
      </div>

      <button id="generated-map-toggle" class="debug-map-toggle" type="button" aria-label="Use generated map" aria-pressed="false" title="Toggle generated map view">
        Map: tiles
      </button>

      <button id="selection-fx-toggle" class="selection-fx-toggle" type="button" aria-label="Use current tile selection effect" aria-pressed="true" title="Switch to current selection art">
        Selection: Premium
      </button>

      <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">
        <svg class="fullscreen-enter-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
        </svg>
        <svg class="fullscreen-exit-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" />
        </svg>
      </button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
