name: Patch camera drag without competing handlers

on:
  push:
    paths:
      - .github/workflows/patch-drag-direct.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace drag implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          scene = Path('src/game/GameScene.ts')
          text = scene.read_text()

          text, count = re.subn(
              r"interface DragState \{\s*startX: number;\s*startY: number;\s*scrollX: number;\s*scrollY: number;\s*moved: boolean;\s*\}",
              """interface DragState {
            startX: number;
            startY: number;
            lastX: number;
            lastY: number;
            moved: boolean;
          }""",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one DragState block, replaced {count}')

          start = text.index("    this.input.on('pointerdown', (pointer: Phaser.Input.Pointer) => {")
          end = text.index("    this.input.on('pointerup', () => {", start)
          replacement = """    this.input.on('pointerdown', (pointer: Phaser.Input.Pointer) => {
            if (!pointer.isDown) return;
            this.dragState = {
              startX: pointer.x,
              startY: pointer.y,
              lastX: pointer.x,
              lastY: pointer.y,
              moved: false,
            };
          });

          this.input.on('pointermove', (pointer: Phaser.Input.Pointer) => {
            if (!pointer.isDown || !this.dragState) return;

            if (!this.dragState.moved) {
              const startDx = pointer.x - this.dragState.startX;
              const startDy = pointer.y - this.dragState.startY;
              if (Math.hypot(startDx, startDy) < 7) return;

              // Crossing the threshold only arms panning. Rebase here so none of
              // the click/drag dead-zone distance is ever applied as a camera jump.
              this.dragState.moved = true;
              this.dragState.lastX = pointer.x;
              this.dragState.lastY = pointer.y;
              this.game.canvas.classList.add('dragging');
              return;
            }

            const dx = pointer.x - this.dragState.lastX;
            const dy = pointer.y - this.dragState.lastY;
            this.dragState.lastX = pointer.x;
            this.dragState.lastY = pointer.y;
            if (dx === 0 && dy === 0) return;

            camera.setScroll(
              camera.scrollX - dx / camera.zoom,
              camera.scrollY - dy / camera.zoom,
            );
            this.constrainCamera();
          });

          """
          text = text[:start] + replacement + text[end:]
          scene.write_text(text)

          main = Path('src/main.ts')
          text = main.read_text()
          text = text.replace(
              "import { SmoothDragGameScene } from './game/SmoothDragGameScene';",
              "import { AnimatedPrototypeGameScene } from './game/AnimatedPrototypeGameScene';",
          )
          text = text.replace('scene: [SmoothDragGameScene],', 'scene: [AnimatedPrototypeGameScene],')
          if 'SmoothDragGameScene' in text:
              raise SystemExit('SmoothDragGameScene reference remains in main.ts')
          main.write_text(text)

          smooth = Path('src/game/SmoothDragGameScene.ts')
          if smooth.exists():
              smooth.unlink()
          PY

      - name: Typecheck and build
        run: npm ci && npm run build

      - name: Commit direct drag fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/patch-drag-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix camera drag startup teleport"
          git push origin HEAD:main
