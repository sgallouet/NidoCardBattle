<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141119" />
    <title>NidoCardBattle Prototype</title>
  </head>
  <body>
    <main id="app">
      <div id="game-container" aria-label="NidoCardBattle draggable hex battlefield"></div>
      <div id="status" class="sr-only" role="status" aria-live="polite">Player 1 begins.</div>

      <div id="victory-log-actions" class="victory-log-actions glass-panel" hidden>
        <button id="battle-log-download-button" class="battle-log-download" type="button">
          Download Battle Log
        </button>
        <span>Compact JSON for AI review</span>
      </div>

      <div class="mana-count" aria-label="Current mana">
        <span class="mana-gem"></span>
        <strong id="mana-count">3/10</strong>
      </div>

      <aside id="unit-inspector" class="unit-inspector glass-panel" hidden>
        <button id="cancel-button" class="close-selection" type="button" aria-label="Clear unit selection">×</button>
        <div id="selected-unit" class="selected-unit muted">Select a unit on the battlefield.</div>
        <div class="action-row">
          <button id="ability-button" class="secondary" type="button" hidden></button>
        </div>
      </aside>

      <section class="hand-dock">
        <div class="hand-and-turn">
          <div id="hand" class="hand"></div>
          <div class="turn-control">
            <button id="end-turn-button" class="end-turn" type="button">End Turn</button>
            <div id="turn-indicator" class="turn-indicator">Player 1 turn</div>
            <button id="tile-border-button" class="secondary" type="button" aria-pressed="true">Borders: On</button>
            <button id="map-render-button" class="secondary" type="button">Map: Tiled</button>
            <button id="new-game-button" class="secondary" type="button">New Game</button>
          </div>
        </div>
      </section>

      <div id="debug-status" class="debug-status" data-tone="idle">
        Debug: ready — click End Turn to trace the turn and AI.
      </div>

      <button id="generated-map-toggle" class="debug-map-toggle" type="button" aria-label="Use generated map" aria-pressed="false" title="Toggle generated map view">
        Map: tiles
      </button>

      <button id="selection-fx-toggle" class="selection-fx-toggle" type="button" aria-label="Use current tile selection effect" aria-pressed="true" title="Switch to current selection art">
        Selection: Premium
      </button>

      <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">
        <svg class="fullscreen-enter-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
        </svg>
        <svg class="fullscreen-exit-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" />
        </svg>
      </button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
